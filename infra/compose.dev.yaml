name: ryde-dev
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ryde
      POSTGRES_USER: ryde
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ryde -d ryde"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  dev_pgdata:
